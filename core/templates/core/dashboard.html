<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sscrap Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>

  <body>
    <div class="container mt-4">
      <h1>Sscrap Dashboard</h1>
      <p>Pusat kontrol untuk semua operasi scraping.</p>

      {% if messages %} {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %} {% endif %}

      <div class="card">
        <div class="card-header">YouTube Scraper</div>
        <div class="card-body">
          <form action="{% url 'trigger_youtube_scrape' %}" method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label for="query" class="form-label">Kalimat Pencarian</label>
              <input type="text" class="form-control" id="query" name="query" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Tipe Konten</label>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="video_type" id="type_video" value="video" checked />
                <label class="form-check-label" for="type_video">Video Biasa</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="video_type" id="type_short" value="short" />
                <label class="form-check-label" for="type_short">Shorts</label>
              </div>
            </div>
            <button type="submit" class="btn btn-primary">Jalankan Scraper YouTube</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
